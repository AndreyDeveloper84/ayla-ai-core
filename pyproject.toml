[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayla-ai-core"
version = "0.7.2"
description = "Shared AI orchestration core for Ayla and Formula tela bot — AIConcierge, tools, anti-hallucination, multi-tenant brand voices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Andrey Tikhonov" }]
keywords = ["ai", "llm", "orchestrator", "ayla"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Private :: Do Not Upload",
]

dependencies = [
    "openai>=1.40,<2.0",
    "django>=5.2,<6.0",
    "asgiref>=3.7",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-django>=4.8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/AndreyDeveloper84/ayla-ai-core"
Issues = "https://linear.app/drfproject"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ayla_ai_core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001/002/003 — false positives для проекта с русскоязычными комментариями
# (warns про Cyrillic letters looking like Latin); E501 — line length, N806 — non-lowercase var
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests — lambdas, magic values, and asserts are intentional
"tests/*" = ["E731", "B008", "S101"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
